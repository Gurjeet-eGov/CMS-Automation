name: Sync product suite

# Bring the product repo's latest integration suite into master, as a PR you
# review. Run it whenever you want the product's new and fixed tests.
#
# How it works (docs/GUIDE.md §4):
#   1. The product-suite branch only ever holds the product's suite, as it was
#      at the last sync. This workflow replaces it with the product's suite at
#      `ref` (plus the vendoring of outside imports: tests/integration-tests/
#      vendor/README.md) and commits that.
#   2. It opens (or updates) a PR product-suite → master. Git compares the
#      product's change since the last sync with master, so your own edits on
#      master are kept; a real conflict shows up in the PR for you to resolve.
#   3. Merge that PR with "Create a merge commit" — NOT squash or rebase — so
#      the next sync knows what was already brought in.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests" (docs/GUIDE.md §2, step 4).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Product repo branch, tag or commit to sync from
        type: string
        default: develop

permissions:
  contents: write       # push the product-suite branch
  pull-requests: write  # open the PR into master

concurrency:
  group: sync-product-suite
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: ${{ vars.PRODUCT_REPO || 'egovernments/Citizen-Complaint-Resolution-System' }}
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out master (for the sync scripts)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch the product suite
        id: fetch
        run: |
          sha="$(ci/fetch-product.sh "$PRODUCT_REPO" "$REF" .work/product)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update the product-suite branch
        id: update
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify -q origin/product-suite >/dev/null; then
            echo "::error title=No product-suite branch::Push the product-suite branch first (docs/GUIDE.md §2, step 1)."
            exit 1
          fi
          git worktree add -q .work/product-suite-branch origin/product-suite
          cd .work/product-suite-branch
          git checkout -q -B product-suite
          node ../../ci/import-product-suite.mjs ../product tests/integration-tests \
            --repo "$PRODUCT_REPO" --ref "$REF" --sha "$SHA"
          git add -A tests/integration-tests
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The product suite at $REF (${SHA:0:9}) is already what product-suite holds: nothing to sync." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tail -1 | sed 's/^ */Changed: /' | tee -a "$GITHUB_STEP_SUMMARY"
          git commit -q -m "Sync product suite: $PRODUCT_REPO @ $REF (${SHA:0:9})" \
            -m "tests/integration-tests from $PRODUCT_REPO at $REF, commit $SHA, copied by ci/import-product-suite.mjs."
          git push -q origin product-suite
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR into master
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          existing="$(gh pr list --base master --head product-suite --state open --json url --jq '.[0].url')"
          if [[ -n "$existing" ]]; then
            echo "Updated the open PR: $existing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch -q origin master product-suite
          if [[ -z "$(git log --oneline origin/master..origin/product-suite)" ]]; then
            echo "master already has everything on product-suite." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > .work/pr-body.md <<EOF
          Brings the product's integration suite into master: \`$PRODUCT_REPO\` at \`$REF\` (commit \`$SHA\`).

          **Review** the Files tab: these are the product's own changes since the last sync. Your edits on master are kept by the merge.

          **Merge with "Create a merge commit"** (not squash or rebase), so the next sync knows what master already has.

          After it's merged, the *Propagate to implementations* workflow opens a PR into each \`impl/*\` branch.
          EOF
          url="$(gh pr create --base master --head product-suite \
            --title "Sync product suite ($REF @ ${SHA:0:9})" --body-file .work/pr-body.md)"
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
