name: Integration tests

# Runs the CMS/PGR Playwright suite against one deployment, publishes full runs
# to the GitHub Pages dashboard, and raises the alarm (red run + Slack) only when
# something unusual happened. New to GitHub Actions? Start with docs/GUIDE.md.
#
# To run: Actions → Integration tests → Run workflow, then pick
#   - the branch ("Use workflow from": master, or an implementation branch
#     impl/<name>) — that branch's suite runs;
#   - the environment: a GitHub Environment (Settings → Environments) holding
#     two secrets, each a whole file pasted once: CONFIG_ENV (the config.env:
#     address, tenant, workspace slug…) and SECRETS_ENV (the secrets.env:
#     logins and passwords). The dropdown lists them by itself;
#   - optionally scope (default full) and grep.
# An environment missing one of its two secrets stops the run, naming it.
# docs/GUIDE.md §2 shows how to set an environment up.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment to test — a GitHub Environment holding CONFIG_ENV and SECRETS_ENV
        type: environment
        required: true
      scope:
        description: Which tests (full = everything, and the only scope that goes on the dashboard; profile-only = read-only check of the deployment)
        type: choice
        options: [full, profile-only, smoke, api, smoke+api, citizen, employee, admin, lifecycle]
        default: full
      grep:
        description: Optional — only tests whose title or tags match, e.g. @area:pgr
        type: string
        required: false

  # ── Scheduled runs (off for now) ──────────────────────────────────────────
  # To run automatically, uncomment the two lines below and set the repository
  # variables SCHEDULED_ENVIRONMENT (default naipepea) and SCHEDULED_BRANCH
  # (default master). Cron times are UTC: '30 20 * * *' is 02:00 IST daily.
  # Schedules only run from the default branch (master). docs/GUIDE.md §6.
  # schedule:
  #   - cron: '30 20 * * *'

permissions:
  contents: read

# One run at a time per deployment: the suite changes data on the tenant, and
# two runs at once would trip over each other. A new run waits for the current
# one; note GitHub keeps only ONE waiting run per group (a third replaces it).
concurrency:
  group: integration-tests-${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }}
  SCOPE: ${{ inputs.scope || 'full' }}
  # Always the suite on the chosen branch (the product's own suite reaches the
  # branches through the Sync product suite workflow).
  SUITE_SOURCE: this-branch
  PRODUCT_REF: develop
  PRODUCT_REPO: ${{ vars.PRODUCT_REPO || 'egovernments/Citizen-Complaint-Resolution-System' }}
  # Scheduled runs check out SCHEDULED_BRANCH; manual runs use the branch picked in the form.
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && (vars.SCHEDULED_BRANCH || 'master') || '' }}

jobs:
  run-tests:
    name: Run tests (${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }} · ${{ inputs.scope || 'full' }})
    # Pinned, not ubuntu-latest: ubuntu-latest moved to 26.04, where Playwright
    # 1.59 can't install Chromium. Move on once the suite's Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The chosen GitHub Environment: its CONFIG_ENV and SECRETS_ENV secrets.
    environment: ${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }}
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      # Stop at once, naming what is missing, rather than 10 minutes in.
      # Until an environment has its own two secrets, the old setup still works:
      # environments/<name>/config.env in the repo, and the SECRETS_<NAME>
      # repository secret.
      - name: Check the environment's secrets
        env:
          HAS_CONFIG: ${{ secrets.CONFIG_ENV != '' }}
          HAS_SECRETS: ${{ secrets.SECRETS_ENV != '' }}
          HAS_OLD_SECRETS: ${{ secrets[format('SECRETS_{0}', inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea')] != '' }}
        run: |
          missing=()
          if [[ "$HAS_CONFIG" != "true" ]]; then
            if [[ -f "environments/$ENVIRONMENT/config.env" ]]; then
              echo "::notice title=Old setup::No CONFIG_ENV in the $ENVIRONMENT environment yet: using environments/$ENVIRONMENT/config.env from the repo. Paste it into CONFIG_ENV (docs/GUIDE.md §2)."
            else
              missing+=(CONFIG_ENV)
            fi
          fi
          if [[ "$HAS_SECRETS" != "true" ]]; then
            if [[ "$HAS_OLD_SECRETS" == "true" ]]; then
              echo "::notice title=Old setup::No SECRETS_ENV in the $ENVIRONMENT environment yet: using the old repository secret. Paste your secrets.env into SECRETS_ENV (docs/GUIDE.md §2)."
            else
              missing+=(SECRETS_ENV)
            fi
          fi
          if (( ${#missing[@]} )); then
            for m in "${missing[@]}"; do
              echo "::error title=Missing secret::$m is missing in the $ENVIRONMENT environment's secrets"
            done
            exit 1
          fi

      - name: Prepare the suite
        run: ci/prepare-suite.sh --source "$SUITE_SOURCE" --ref "$PRODUCT_REF"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/integration-tests/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: .work/suite
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the tests
        env:
          # The environment's two pasted files (docs/GUIDE.md §2). Old setup:
          # the SECRETS_<NAME> repository secret, and the config.env in the repo
          # (used when ENV_CONFIG is empty).
          ENV_CONFIG: ${{ secrets.CONFIG_ENV }}
          ENV_CONFIG_NAME: the CONFIG_ENV secret of the ${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }} environment
          ENV_SECRETS: ${{ secrets.SECRETS_ENV || secrets[format('SECRETS_{0}', inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea')] }}
          ENV_SECRETS_NAME: ${{ secrets.SECRETS_ENV != '' && 'the SECRETS_ENV secret' || 'the old SECRETS_<NAME> repository secret' }} of the ${{ inputs.environment || vars.SCHEDULED_ENVIRONMENT || 'naipepea' }} environment
          GREP: ${{ inputs.grep }}
          RECORD_SCREENSHOTS: ${{ vars.RECORD_SCREENSHOTS }}
          RECORD_VIDEO: ${{ vars.RECORD_VIDEO }}
          RECORD_TRACES: ${{ vars.RECORD_TRACES }}
          PW_GLOBAL_TIMEOUT_MS: ${{ vars.PW_GLOBAL_TIMEOUT_MS || '5400000' }}
        run: ci/run-suite.sh --environment "$ENVIRONMENT" --scope "$SCOPE"

      - name: Upload results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.ENVIRONMENT }}
          path: .work/out/
          retention-days: 14
          overwrite: true
          include-hidden-files: true # the results sit under .work/
          if-no-files-found: warn

  report:
    name: Publish and report
    needs: run-tests
    # Also after a failed or timed-out test job (that is news), but not when
    # someone cancelled the run on purpose.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the dashboard to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: results-${{ env.ENVIRONMENT }}
          path: .work/out

      - name: Decide what to publish
        id: decide
        run: |
          meta=.work/out/run-meta.json
          if [[ -f "$meta" && -f .work/out/report.json ]] && [[ "$(jq -r .partial "$meta")" == "false" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$meta" ]]; then
            echo "has-meta=true" >> "$GITHUB_OUTPUT"
            echo "source-ref=$(jq -r 'if .source.kind == "product" then .source.sha else "" end' "$meta")" >> "$GITHUB_OUTPUT"
            echo "dashboard-key=$(jq -r .dashboardKey "$meta")" >> "$GITHUB_OUTPUT"
          fi

      # The same suite the tests ran with (for a product run: the same commit),
      # for build-catalog and the regression comparison.
      - name: Prepare the suite
        if: steps.decide.outputs.has-meta == 'true'
        env:
          SOURCE_REF: ${{ steps.decide.outputs.source-ref }}
        run: ci/prepare-suite.sh --source "$SUITE_SOURCE" --ref "${SOURCE_REF:-$PRODUCT_REF}"

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/integration-tests/package-lock.json

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        working-directory: .work/suite
        run: npm ci --no-audit --no-fund

      - name: Publish to GitHub Pages
        id: publish
        if: steps.decide.outputs.publish == 'true'
        continue-on-error: true # a failed publish is reported by the summary below
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTS_KEPT: ${{ vars.REPORTS_KEPT || '5' }}
        run: ci/push-pages.sh

      - name: Summarize
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.run-tests.outputs.artifact-url }}
          PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          NOTIFY: ${{ vars.NOTIFY || 'problems-only' }} # problems-only, always or never
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          DASHBOARD_KEY: ${{ steps.decide.outputs.dashboard-key }}
        run: |
          args=(--out .work/out --suite .work/suite --notify "$NOTIFY")
          if [[ "$PUBLISHED" == "true" ]]; then
            args+=(--published --catalog ".work/site/$DASHBOARD_KEY/catalog.json")
          fi
          node ci/summarize.mjs "${args[@]}"

      - name: Send to Slack
        if: steps.summary.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "No SLACK_WEBHOOK_URL secret yet: skipping Slack (docs/GUIDE.md §2, step 3)."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 30 -X POST -H 'Content-Type: application/json' \
            --data @.work/slack-payload.json "$SLACK_WEBHOOK_URL" \
            || echo "::warning title=Slack::Slack did not accept the message (is the webhook URL still valid?)"

      # Red only when something unusual happened. That also makes GitHub email
      # you (Settings → Notifications → Actions), on top of Slack.
      - name: Verdict
        env:
          ALERT: ${{ steps.summary.outputs.alert }}
          HEADLINE: ${{ steps.summary.outputs.headline }}
        run: |
          if [[ "$ALERT" == "true" ]]; then
            echo "::error title=Unusual test run::$HEADLINE"
            exit 1
          fi
          if [[ -z "$ALERT" ]]; then
            echo "::error title=Report step::The summary step did not finish; see its log."
            exit 1
          fi
          echo "$HEADLINE"
